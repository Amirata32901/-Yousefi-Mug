<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت فروشگاه یوسفی</title>

<style>
*{
  box-sizing:border-box;
  font-family:tahoma;
}

body{
  margin:0;
  background:#fffdf5;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.box{
  background:white;
  width:420px;
  padding:35px;
  border-radius:30px;
  border:3px solid #ffd600;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}

h1{
  text-align:center;
  color:#e53935;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border:2px solid #eee;
  border-radius:14px;
  font-size:15px;
}

input:focus{
  border-color:#ffd600;
  outline:none;
}

button{
  width:100%;
  padding:14px;
  background:#e53935;
  color:white;
  border:none;
  border-radius:14px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
  margin-top:10px;
}

button:hover{
  background:#c62828;
}

#step2,#panel{
  display:none;
}

.ok{
  color:#2e7d32;
  font-weight:bold;
  text-align:center;
  margin-top:15px;
}

.err{
  color:#c62828;
  font-weight:bold;
  text-align:center;
  margin-top:15px;
}

.panel-box{
  background:#fff8cc;
  padding:20px;
  border-radius:20px;
  margin-top:20px;
}

#products{
  margin-top:20px;
}

.item{
  background:white;
  border:2px solid #ffd600;
  border-radius:15px;
  padding:10px;
  margin-bottom:15px;
}

.item img{
  width:100%;
  border-radius:10px;
  margin-top:10px;
  max-height:200px;
  object-fit:cover;
}

.delete-btn{
  background:#c62828;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="box">

  <h1>🔐 پنل مدیریت فروشگاه یوسفی</h1>

  <div id="step1">
    <input type="password" id="pass1" placeholder="رمز مرحله اول">
    <button onclick="check1()">ادامه</button>
    <div id="msg1"></div>
  </div>

  <div id="step2">
    <input type="password" id="pass2" placeholder="رمز مرحله دوم">
    <button onclick="check2()">ورود به مدیریت</button>
    <div id="msg2"></div>
  </div>

  <div id="panel">

    <div class="ok">✅ ورود موفق بود</div>

    <div class="panel-box">

      <h3>➕ افزودن آگهی جدید</h3>

      <input type="text" id="title" placeholder="اسم محصول">

      <input type="text" id="price" placeholder="قیمت (مثلاً 350000)">

      <input type="text" id="image" placeholder="لینک عکس محصول">

      <button onclick="addProduct()">افزودن محصول</button>

      <div id="addmsg" class="ok"></div>

    </div>

    <div id="products"></div>

  </div>

</div>

<script>

function check1(){

  if(document.getElementById('pass1').value === '1080'){

    document.getElementById('step1').style.display='none';
    document.getElementById('step2').style.display='block';

  }else{

    document.getElementById('msg1').innerHTML =
      '<div class="err">❌ رمز اول اشتباه است</div>';
  }
}

function check2(){

  if(document.getElementById('pass2').value === '3201'){

    document.getElementById('step2').style.display='none';
    document.getElementById('panel').style.display='block';

    showProducts();

  }else{

    document.getElementById('msg2').innerHTML =
      '<div class="err">❌ رمز دوم اشتباه است</div>';
  }
}

function addProduct(){

  const title = document.getElementById('title').value;
  const price = document.getElementById('price').value;
  const image = document.getElementById('image').value;

  if(title === '' || price === '' || image === ''){
    alert('همه فیلدها را پر کن');
    return;
  }

  const product = { title, price, image };

  let products =
    JSON.parse(localStorage.getItem('products') || '[]');

  products.push(product);

  localStorage.setItem('products', JSON.stringify(products));

  document.getElementById('addmsg').innerText =
    '✅ محصول جدید اضافه شد';

  document.getElementById('title').value='';
  document.getElementById('price').value='';
  document.getElementById('image').value='';

  showProducts();
}

function showProducts(){

  const products =
    JSON.parse(localStorage.getItem('products') || '[]');

  const box = document.getElementById('products');

  box.innerHTML='';

  products.forEach((p,index)=>{

    box.innerHTML += `
      <div class="item">
        <b>${p.title}</b>
        <p>💰 ${p.price} تومان</p>
        <img src="${p.image}" alt="product">

        <button class="delete-btn"
          onclick="deleteProduct(${index})">
          🗑️ حذف محصول
        </button>
      </div>
    `;
  });
}

function deleteProduct(index){

  let products =
    JSON.parse(localStorage.getItem('products') || '[]');

  products.splice(index,1);

  localStorage.setItem('products', JSON.stringify(products));

  showProducts();
}

</script>

</body>
</html>
