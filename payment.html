<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پرداخت | Funny Shop</title>
  <style>
    body{
      margin:0;
      font-family:tahoma;
      background:#fffdf5;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .box{
      background:white;
      padding:40px;
      border-radius:30px;
      width:350px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,.15);
      border:3px solid #ffd600;
    }

    h1{
      color:#e53935;
      margin-bottom:10px;
    }

    .price{
      font-size:28px;
      font-weight:bold;
      margin:20px 0;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:15px;
      background:#e53935;
      color:white;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      transition:.3s;
    }

    button:hover{
      background:#c62828;
    }

    .back{
      display:block;
      margin-top:15px;
      color:#555;
      text-decoration:none;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Funny Shop</h1>
    <p>در حال پرداخت محصول</p>

    <div class="price">250,000 تومان</div>

    <button onclick="alert('پرداخت با موفقیت انجام شد 🎉')">
      پرداخت
    </button>

    <a class="back" href="index.html">بازگشت به فروشگاه</a>
  </div>

</body>
</html>
