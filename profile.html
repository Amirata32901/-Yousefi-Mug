<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پروفایل | Funny Shop</title>

<style>
body{
  margin:0;
  font-family:tahoma;
  background:#fffdf5;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.box{
  background:white;
  width:380px;
  padding:35px;
  border-radius:30px;
  border:3px solid #ffd600;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}

h1{
  text-align:center;
  color:#e53935;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border:2px solid #eee;
  border-radius:14px;
  font-size:15px;
  box-sizing:border-box;
}

input:focus{
  border-color:#ffd600;
  outline:none;
}

button{
  width:100%;
  padding:14px;
  background:#e53935;
  color:white;
  border:none;
  border-radius:14px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
  margin-top:10px;
}

button:hover{
  background:#c62828;
}

#msg{
  text-align:center;
  margin-top:15px;
  color:#2e7d32;
  font-weight:bold;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  text-decoration:none;
  color:#555;
}
</style>
</head>

<body>

<div class="box">

  <h1>پروفایل کاربر</h1>

  <input type="text" id="name" placeholder="نام و نام خانوادگی">

  <input type="tel" id="phone" placeholder="شماره تلفن">

  <input type="text" id="address" placeholder="آدرس">

  <input type="password" id="pass" placeholder="رمز عبور">

  <button onclick="saveProfile()">ثبت اطلاعات</button>

  <div id="msg"></div>

  <a class="back" href="index.html">بازگشت به فروشگاه</a>

</div>

<script>
function saveProfile(){

  const profile = {
    name: document.getElementById('name').value,
    phone: document.getElementById('phone').value,
    address: document.getElementById('address').value,
    pass: document.getElementById('pass').value
  };

  localStorage.setItem('funnyProfile', JSON.stringify(profile));

  document.getElementById('msg').innerText =
  'اطلاعات با موفقیت ذخیره شد ✅';
}

window.onload = function(){

  const data = localStorage.getItem('funnyProfile');

  if(data){

    const profile = JSON.parse(data);

    document.getElementById('name').value = profile.name || '';
    document.getElementById('phone').value = profile.phone || '';
    document.getElementById('address').value = profile.address || '';
    document.getElementById('pass').value = profile.pass || '';
  }
}
</script>

</body>
</html>
